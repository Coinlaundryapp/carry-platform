apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: carry-infra
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: carry-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: http-ui
      port: 16686
      targetPort: 16686
      protocol: TCP
    - name: grpc-otlp
      port: 4317
      targetPort: 4317
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: carry-infra
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: carry-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/part-of: carry-platform
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62
          ports:
            - name: http-ui
              containerPort: 16686
              protocol: TCP
            - name: grpc-otlp
              containerPort: 4317
              protocol: TCP
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 10
            periodSeconds: 10
