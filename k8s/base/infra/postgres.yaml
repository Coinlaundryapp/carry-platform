apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: carry-infra
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: carry-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: tcp-postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: carry-infra
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: carry-platform
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: carry-platform
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: tcp-postgres
              containerPort: 5432
              protocol: TCP
          args:
            - "-c"
            - "wal_level=logical"
          env:
            - name: POSTGRES_DB
              value: "carry"
            - name: POSTGRES_USER
              value: "carry"
            - name: POSTGRES_PASSWORD
              value: "carry"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - carry
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
