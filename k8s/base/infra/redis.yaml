apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: carry-infra
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: carry-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: tcp-redis
      port: 6379
      targetPort: 6379
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: carry-infra
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: carry-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: carry-platform
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: tcp-redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
