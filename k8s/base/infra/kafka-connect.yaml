apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  namespace: carry-infra
  labels:
    app.kubernetes.io/name: kafka-connect
    app.kubernetes.io/part-of: carry-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kafka-connect
  ports:
    - name: http
      port: 8083
      targetPort: 8083
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  namespace: carry-infra
  labels:
    app.kubernetes.io/name: kafka-connect
    app.kubernetes.io/part-of: carry-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-connect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-connect
        app.kubernetes.io/part-of: carry-platform
    spec:
      containers:
        - name: kafka-connect
          image: debezium/connect:2.7
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          env:
            - name: GROUP_ID
              value: "carry-connect"
            - name: CONFIG_STORAGE_TOPIC
              value: "connect-configs"
            - name: OFFSET_STORAGE_TOPIC
              value: "connect-offsets"
            - name: STATUS_STORAGE_TOPIC
              value: "connect-status"
            - name: BOOTSTRAP_SERVERS
              value: "kafka.carry-infra.svc.cluster.local:9092"
            - name: CONFIG_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: OFFSET_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: STATUS_STORAGE_REPLICATION_FACTOR
              value: "1"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
