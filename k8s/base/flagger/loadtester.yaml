apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagger-loadtester
  namespace: carry
  labels:
    app.kubernetes.io/name: flagger-loadtester
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flagger-loadtester
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flagger-loadtester
    spec:
      containers:
        - name: loadtester
          image: ghcr.io/flaggercd/loadtester:0.31.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 128Mi
              cpu: 100m
---
apiVersion: v1
kind: Service
metadata:
  name: flagger-loadtester
  namespace: carry
spec:
  selector:
    app.kubernetes.io/name: flagger-loadtester
  ports:
    - port: 80
      targetPort: 8080
