apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagger
  namespace: carry-infra
  labels:
    app.kubernetes.io/name: flagger
    app.kubernetes.io/part-of: carry-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flagger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flagger
    spec:
      containers:
        - name: flagger
          image: ghcr.io/flaggercd/flagger:1.37.0
          args:
            - -mesh-provider=linkerd
            - -metrics-server=http://linkerd-viz-prometheus:9090
            - -log-level=info
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 250m
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
