apiVersion: apps/v1
kind: Deployment
metadata:
  name: carry-app
  namespace: carry
  labels:
    app.kubernetes.io/name: carry-app
    app.kubernetes.io/part-of: carry-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: carry-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: carry-app
        app.kubernetes.io/part-of: carry-platform
      annotations:
        linkerd.io/inject: enabled
    spec:
      containers:
        - name: carry-app
          image: carry-platform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: carry-app-config
            - secretRef:
                name: carry-app-secret
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 20
      terminationGracePeriodSeconds: 30
