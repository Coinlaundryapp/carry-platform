apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # Reduce carry-app replicas to 1 and lower resources
  - target:
      kind: Deployment
      name: carry-app
      namespace: carry
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: carry-app
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: carry-app
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 250m
                    memory: 256Mi

  # Expose carry-app via NodePort for local access
  - target:
      kind: Service
      name: carry-app
      namespace: carry
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: carry-app
      spec:
        type: NodePort
        ports:
          - name: http
            port: 8080
            targetPort: http
            nodePort: 30080

  # Expose Jaeger UI via NodePort
  - target:
      kind: Service
      name: jaeger
      namespace: carry-infra
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: jaeger
      spec:
        type: NodePort
        ports:
          - name: http-ui
            port: 16686
            targetPort: 16686
            nodePort: 30686
          - name: grpc-otlp
            port: 4317
            targetPort: 4317
