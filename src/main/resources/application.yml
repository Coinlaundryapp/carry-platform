spring:
  r2dbc:
    url: r2dbc:${settings.datasource.mysql.url}
    username: ${settings.datasource.mysql.username}
    password: ${settings.datasource.mysql.password}
    pool:
      enabled: true
      max-size: 20
      initial-size: 10
      max-idle-time: 30m
      max-create-connection-time: 10s
      validation-query: SELECT 1
  flyway:
    enabled: true
    url: jdbc:${settings.datasource.mysql.url}
    user: ${settings.datasource.mysql.username}
    password: ${settings.datasource.mysql.password}

