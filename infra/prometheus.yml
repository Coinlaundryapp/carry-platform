# Prometheus scrape config — Phase 3.2 관측성 스택
#
# carry-platform 앱은 `/actuator/prometheus`로 Micrometer 메트릭을 노출한다
# (carry-infra-observability의 `micrometer-registry-prometheus` 의존성 + application.yml의
# `management.endpoints.web.exposure.include`에 `prometheus` 포함).
#
# 앱은 docker-compose 외부(로컬 8080)에서 구동되므로 컨테이너에서 호스트로 접근하는
# `host.docker.internal`을 사용한다. Linux Docker Engine에서는 docker-compose의
# `extra_hosts: ["host.docker.internal:host-gateway"]`로 동등한 효과를 낸다.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: carry-local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: carry-platform
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          application: carry-platform

  # OTel Collector의 Prometheus exporter(8889). 현재 앱은 OTLP로 metrics를 보내지
  # 않지만(트레이싱만 OTLP), 추후 OTel SDK auto-instrumentation 도입 시 활성화한다.
  # 활성화하면 동일 메트릭 중복 수집 가능성 있으니 그때 라벨/relabel로 정리.
  # - job_name: otel-collector
  #   static_configs:
  #     - targets: ['otel-collector:8889']
