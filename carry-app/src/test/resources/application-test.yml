spring:
  application:
    name: carry-platform-test
  threads:
    virtual:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_batch_fetch_size: 100
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:0
    listener:
      auto-startup: false
    consumer:
      group-id: test
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # ⚠️ 문자열 클래스명이라 컴파일러가 못 잡는다 — Boot 4 에서 패키지·이름이 바뀌자 제외가 조용히 무효가 되어
  # 테스트가 Redis 에 붙으려 했다(RedisConnectionFailureException). Boot 업그레이드 때 이 목록을 다시 확인할 것.
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration

jwt:
  secret: test-secret-key-for-integration-tests
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

cloud:
  aws:
    s3:
      endpoint: http://localhost:4566
      bucket: carry-media-test
    credentials:
      access-key: test
      secret-key: test
    region:
      static: ap-northeast-2

management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    export:
      enabled: false

carry:
  geo:
    naver:
      client-id: test
      client-secret: test

logging:
  level:
    com.carry: DEBUG
    org.hibernate.SQL: DEBUG
