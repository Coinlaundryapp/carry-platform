spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    properties:
      hibernate:
        format_sql: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET}

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET:carry-media}
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}

carry:
  kafka:
    # 클라우드 미준비 → 기본 1(단일 브로커). 멀티브로커 준비 후 env로 3/2.
    replication-factor: ${CARRY_KAFKA_REPLICATION_FACTOR:1}
    min-insync-replicas: ${CARRY_KAFKA_MIN_INSYNC_REPLICAS:1}
  geo:
    naver:
      client-id: ${NAVER_CLIENT_ID}
      client-secret: ${NAVER_CLIENT_SECRET}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://otel-collector:4318/v1/traces}
    metrics:
      export:
        enabled: true
        endpoint: ${MANAGEMENT_OTLP_METRICS_ENDPOINT:http://otel-collector:4318/v1/metrics}

logging:
  level:
    com.carry: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
