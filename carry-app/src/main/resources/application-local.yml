spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/carry
    username: carry
    password: carry
    driver-class-name: org.postgresql.Driver

  # 스키마는 base application.yml의 Flyway(classpath:db/migration) + ddl-auto:validate를 상속한다.
  # 로컬도 테스트/프로드와 동일한 Flyway 관리 경로를 쓴다(과거 update+flyway:false 오버라이드 제거).
  # 스키마 리셋이 필요하면 scripts/db-reset.sh|ps1로 볼륨을 비우고 재기동한다.
  jpa:
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092,localhost:9094,localhost:9096

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: carry-local-dev-secret-key-do-not-use-in-production

cloud:
  aws:
    s3:
      endpoint: http://localhost:4566
      bucket: carry-media
    credentials:
      access-key: test
      secret-key: test

carry:
  kafka:
    replication-factor: 3
    min-insync-replicas: 2
  geo:
    naver:
      client-id: ${NAVER_CLIENT_ID:local-test}
      client-secret: ${NAVER_CLIENT_SECRET:local-test}

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
    metrics:
      export:
        enabled: true
        endpoint: http://localhost:4318/v1/metrics

logging:
  level:
    com.carry: DEBUG
    org.hibernate.SQL: DEBUG
