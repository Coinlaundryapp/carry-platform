services:
  postgres:
    image: postgres:16-alpine
    container_name: carry-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: carry
      POSTGRES_USER: carry
      POSTGRES_PASSWORD: carry
    volumes:
      - carry-postgres-data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"

  redis:
    image: redis:7-alpine
    container_name: carry-redis
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.8.1
    container_name: carry-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: carry-kafka-cluster-001

  kafka-connect:
    image: debezium/connect:2.7
    container_name: carry-kafka-connect
    ports:
      - "8083:8083"
    environment:
      GROUP_ID: carry-connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      BOOTSTRAP_SERVERS: kafka:9092
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    depends_on:
      - kafka
      - postgres

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: carry-otel-collector
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    volumes:
      - ./infra/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: carry-jaeger
    ports:
      - "16686:16686"
      - "4317"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # Phase 3.2 — 메트릭 수집·시각화 스택.
  # Prometheus가 carry-platform 앱의 `/actuator/prometheus`를 직접 스크레이프하고,
  # Grafana는 Prometheus를 데이터소스로 사용한다. OTel Collector는 traces 전용.
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: carry-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - carry-prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    # 컨테이너 → 호스트 접근. Docker Desktop(Mac/Windows)은 host.docker.internal 자동 제공,
    # Linux Docker Engine에서는 아래 host-gateway 매핑 필요.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana-oss:11.4.0
    container_name: carry-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - carry-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # Phase 3.4 — 알럿 라우팅
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: carry-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - carry-alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    # 실 Slack/PagerDuty 연결은 후속 PR. 본 PR에서 alertmanager.yml의 api_url을
    # alert-webhook-logger의 stub 경로로 하드코딩 (env 치환은 Alertmanager 자체에서
    # 안 되므로 환경변수 주입 불필요).
    depends_on:
      - alert-webhook-logger

  # Phase 3.4 — Alertmanager가 보낸 webhook 페이로드를 stdout으로 echo.
  # `docker logs -f carry-alert-webhook-logger`로 firing 시 페이로드 확인.
  # 이미지 선택: mendhak/http-https-echo는 별도 hooks.json 설정 없이 모든 경로의
  # POST body를 stdout으로 echo하므로 alertmanager의 webhook 수신 검증에 직접 사용 가능.
  # 대안 adnanh/webhook은 hooks.json 강제로 추가 설정 비용이 있어 본 PoC에서 부적합.
  alert-webhook-logger:
    image: mendhak/http-https-echo:34
    container_name: carry-alert-webhook-logger
    ports:
      - "9095:8080"
    environment:
      HTTP_PORT: "8080"
      LOG_WITHOUT_NEWLINE: "true"

volumes:
  carry-postgres-data:
  carry-prometheus-data:
  carry-grafana-data:
  carry-alertmanager-data:
