services:
  postgres:
    image: postgres:16-alpine
    container_name: carry-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: carry
      POSTGRES_USER: carry
      POSTGRES_PASSWORD: carry
    volumes:
      - carry-postgres-data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"

  redis:
    image: redis:7-alpine
    container_name: carry-redis
    ports:
      - "6379:6379"

  # LocalStack — 로컬 S3(미디어 업로드). 백엔드 S3Config는 cloud.aws.s3.endpoint가 설정되면
  # endpointOverride + forcePathStyle(true)로 LocalStack에 붙는다(application-local.yml의
  # endpoint=http://localhost:4566, creds test/test). ready 훅이 carry-media 버킷을 생성한다.
  # 이게 없으면 배달 단계 사진 업로드(/api/v2/media/upload)가 연결 실패한다.
  localstack:
    image: localstack/localstack:3
    container_name: carry-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ap-northeast-2
      DEBUG: "0"
    volumes:
      - "./infra/localstack/ready.d:/etc/localstack/init/ready.d"

  # Kafka 멀티브로커 HA — 3-node 겸임 KRaft(broker+controller) 클러스터.
  # 리스너 3종 분리(advertised 오설정 = 멀티브로커 최대 footgun 차단):
  #   CONTROLLER(9093) 컨테이너 내부 전용(호스트 매핑 없음, KRaft 쿼럼)
  #   INTERNAL(19092)  브로커 간 + kafka-connect (advertised kafka-N:19092)
  #   EXTERNAL(9092)   호스트 앱/테스트 (advertised localhost:9092·9094·9096)
  # RF=3 + min.insync.replicas=2 + 프로듀서 acks=all → 브로커 1대 다운 허용(무손실).
  kafka-1:
    image: apache/kafka:3.8.1
    container_name: carry-kafka-1
    ports:
      - "9092:9092"   # EXTERNAL (호스트→브로커1)
    environment: &kafka-common-env
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      CLUSTER_ID: carry-kafka-cluster-001
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,EXTERNAL://localhost:9092

  kafka-2:
    image: apache/kafka:3.8.1
    container_name: carry-kafka-2
    ports:
      - "9094:9092"   # 호스트 9094 → 컨테이너 EXTERNAL 9092
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,EXTERNAL://localhost:9094

  kafka-3:
    image: apache/kafka:3.8.1
    container_name: carry-kafka-3
    ports:
      - "9096:9092"   # 호스트 9096 → 컨테이너 EXTERNAL 9092
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,EXTERNAL://localhost:9096

  kafka-connect:
    # 부동 태그 `2.7`은 레지스트리에서 제거되어 manifest unknown → 정확 패치 버전으로 고정(재현성).
    image: debezium/connect:2.7.3.Final
    container_name: carry-kafka-connect
    ports:
      - "8083:8083"
    environment:
      GROUP_ID: carry-connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      # ⚠️ debezium/connect 이미지는 CONNECT_ 접두사 env만 worker 프로퍼티로 변환한다.
      # 접두사 없는 *_STORAGE_REPLICATION_FACTOR는 무시되어 RF=1(기본값)로 남는다(라이브 스모크로 발견).
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
      - postgres

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: carry-otel-collector
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    volumes:
      - ./infra/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: carry-jaeger
    ports:
      - "16686:16686"
      - "4317"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # Phase 3.2 — 메트릭 수집·시각화 스택.
  # Prometheus가 carry-platform 앱의 `/actuator/prometheus`를 직접 스크레이프하고,
  # Grafana는 Prometheus를 데이터소스로 사용한다. OTel Collector는 traces 전용.
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: carry-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - carry-prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    # 컨테이너 → 호스트 접근. Docker Desktop(Mac/Windows)은 host.docker.internal 자동 제공,
    # Linux Docker Engine에서는 아래 host-gateway 매핑 필요.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana-oss:11.4.0
    container_name: carry-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - carry-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # Phase 3.4 — 알럿 라우팅
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: carry-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - carry-alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    # 실 Slack/PagerDuty 연결은 후속 PR. 본 PR에서 alertmanager.yml의 api_url을
    # alert-webhook-logger의 stub 경로로 하드코딩 (env 치환은 Alertmanager 자체에서
    # 안 되므로 환경변수 주입 불필요).
    depends_on:
      - alert-webhook-logger

  # Phase 3.4 — Alertmanager가 보낸 webhook 페이로드를 stdout으로 echo.
  # `docker logs -f carry-alert-webhook-logger`로 firing 시 페이로드 확인.
  # 이미지 선택: mendhak/http-https-echo는 별도 hooks.json 설정 없이 모든 경로의
  # POST body를 stdout으로 echo하므로 alertmanager의 webhook 수신 검증에 직접 사용 가능.
  # 대안 adnanh/webhook은 hooks.json 강제로 추가 설정 비용이 있어 본 PoC에서 부적합.
  alert-webhook-logger:
    image: mendhak/http-https-echo:34
    container_name: carry-alert-webhook-logger
    ports:
      - "9095:8080"
    environment:
      HTTP_PORT: "8080"
      LOG_WITHOUT_NEWLINE: "true"

volumes:
  carry-postgres-data:
  carry-prometheus-data:
  carry-grafana-data:
  carry-alertmanager-data:
