version: 2

# ⚠️ target-branch 는 필수다. Dependabot 은 기본값으로 **기본 브랜치(main)** 에 PR 을 연다.
# 이 저장소의 통합 브랜치는 develop 이라(main 은 승격 PR 로만 따라온다), 그대로 두면 의존성 업데이트가
# main 에만 들어가고 develop 은 계속 옛 버전으로 빌드된다 — 실제로 Gradle 9 업그레이드(#181)가 그렇게
# main 에만 들어갔다. 두 ecosystem 모두 develop 을 base 로 고정한다.
updates:
  # Gradle 의존성(전 모듈 — 루트에서 버전 카탈로그/BOM 관리) 주간 점검.
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    groups:
      # minor/patch는 한 PR로 묶어 노이즈를 줄인다. major는 개별 PR로 분리해 영향 검토.
      gradle-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions 워크플로 액션 버전 주간 점검.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    ignore:
      # gradle/actions v6 부터 캐싱이 독점 컴포넌트(gradle-actions-caching)로 분리돼, 올리는 것 자체가
      # Gradle Terms of Use 동의가 된다(MIT 아님). 약관 동의 없이 v5 에 머문다(2026-10-02 결정, #204).
      # v5.x 의 minor·patch 는 계속 받는다. 다시 검토할 때 이 항목을 지운다.
      - dependency-name: "gradle/actions"
        versions: [">= 6"]
