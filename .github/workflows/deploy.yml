name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: 'Docker image tag to deploy'
        required: true
        default: 'latest'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
      - name: Update image tag
        run: |
          cd k8s/overlays/${{ inputs.environment }}
          kustomize edit set image carry-platform=ghcr.io/${{ github.repository }}/carry-platform:${{ inputs.image_tag }}
      - name: Deploy
        run: kubectl apply -k k8s/overlays/${{ inputs.environment }}
      - name: Wait for rollout
        run: kubectl rollout status deployment/carry-platform -n carry --timeout=300s
