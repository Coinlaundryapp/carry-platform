name: CI/CD

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and Test
        run: ./gradlew build
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/test/*.xml'

  docker:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # github.repository에 대문자가 포함되면 buildx가 거부한다 (Docker 이미지 이름은 전부 소문자여야 함).
      # 기존 nested 경로(<owner>/<repo>/carry-platform)는 보존하여 이미 푸시된 이미지 위치와 호환을 유지.
      - name: Lowercase image path
        id: image
        env:
          REPO: ${{ github.repository }}
        run: echo "path=ghcr.io/${REPO,,}/carry-platform" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.path }}:${{ github.sha }}
            ${{ steps.image.outputs.path }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
